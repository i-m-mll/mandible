[[permission]]
identifier = "allow-desktop-commands"
description = "Allows only the application commands used by the Mandible desktop shell."
commands.allow = [
  "daemon_status",
  "daemon_get_launch_mode",
  "daemon_set_launch_mode",
  "daemon_start",
  "daemon_stop",
  "daemon_restart",
  "native_window_capabilities",
  "navigate_to_desktop_bootstrap",
  "navigate_to_desktop_dashboard",
  "secure_local_connections_status",
  "secure_local_connections_setup",
]
