[package]
name = "mandible-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSBundle", "NSString", "NSError"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["SMAppService", "objc2", "objc2-foundation"] }
serde_json = "1"
libc = "0.2"
