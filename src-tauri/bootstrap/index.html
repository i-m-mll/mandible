<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandible</title>
  <!-- mandible-startup-frame-style -->
  <link rel="stylesheet" href="./bootstrap.css">
</head>
<body class="tauri-window">
  <!-- mandible-startup-frame -->
  <div class="bootstrap-titlebar-drag-region" data-tauri-drag-region aria-hidden="true"></div>
  <main class="bootstrap-controls" id="bootstrap-controls" hidden>
    <p role="alert" id="bootstrap-error" hidden></p>
    <button type="button" id="start-btn" hidden>Start Mandible</button>
    <button type="button" id="retry-btn">Retry</button>
  </main>
  <script src="./canonical-origin.js"></script>
  <script src="./bootstrap.js"></script>
</body>
</html>
