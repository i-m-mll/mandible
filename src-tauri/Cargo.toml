[package]
name = "mandible-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.9"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSWindow", "NSButton"] }
window-vibrancy = "0.8.1"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView"] }
