name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `npm test` is the default suite: it must be green on a runner that has
      # nothing beyond `npm ci`. The extended browser gate (`npm run test:browser`)
      # needs a real Chromium and ImageMagick and is deliberately not run here.
      - name: Test
        run: npm test
