name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      # `bun run test` is the default suite: it must be green on a runner that has
      # nothing beyond `bun install --frozen-lockfile`. The extended browser gate (`bun run test:browser`)
      # needs a real Chromium and ImageMagick and is deliberately not run here.
      - name: Test
        run: bun run test
